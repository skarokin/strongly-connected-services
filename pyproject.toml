[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strongly-connected-services"
version = "0.1.0"
description = "Infer tightly coupled services from alert propagation and trace-derived timing priors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0"]

[project.scripts]
scs = "scs.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
